<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Timetable Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg: #0b1220;
            --panel: #0f172a;
            --text: #e2e8f0;
            --muted: #9aa7b4;
            --card: #0c1424;
            --border: #1f2a3a;
            --accent: #3a6ea5;
            --accent-strong: #2f5b89;
            --accent-soft: #2a3a52;
            --accent-alt: #e7c65a;
            --accent-alt-strong: #d5b34e;
            --success: #2b7a78;
            --danger: #c26d6d;
            
            /* Modern shadows and effects */
            --shadow: 0 20px 40px rgba(0, 0, 0, .4), 0 8px 16px rgba(0, 0, 0, .3);
            --shadow-soft: 0 8px 24px rgba(0, 0, 0, .25), 0 4px 8px rgba(0, 0, 0, .2);
            --shadow-hover: 0 24px 48px rgba(58, 110, 165, .25), 0 12px 24px rgba(0, 0, 0, .3);
            --glow: 0 0 20px rgba(58, 110, 165, .3);
            
            --radius: 20px;
            --radius-sm: 12px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            
            /* Additional shades */
            --accent-light: rgba(58, 110, 165, 0.1);
            --accent-lighter: rgba(58, 110, 165, 0.05);
            --border-light: rgba(31, 42, 58, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: 
                radial-gradient(ellipse 1200px 800px at 20% -10%, rgba(58, 110, 165, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 1000px 600px at 80% 90%, rgba(231, 198, 90, 0.05) 0%, transparent 60%),
                linear-gradient(180deg, #0a111c 0%, #0b1220 100%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header - Modern glassmorphism */
        header {
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(12, 18, 32, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(31, 42, 58, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        header:hover {
            background: rgba(12, 18, 32, 0.85);
            border-bottom-color: var(--border);
        }

        .header-inner {
            width: 100%;
            max-width: 1400px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #cfe2ff 0%, #a5c9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(207, 226, 255, 0.3);
        }

        /* Inputs - Modern design */
        .row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type=text],
        input[type=number],
        select,
        .sselect-input {
            background: rgba(15, 21, 34, 0.6);
            backdrop-filter: blur(10px);
            color: var(--text);
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            outline: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                inset 0 1px 2px rgba(0, 0, 0, 0.3),
                0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
        }

        input[type=text]:hover,
        input[type=number]:hover,
        select:hover,
        .sselect-input:hover {
            border-color: var(--accent);
            background: rgba(15, 21, 34, 0.8);
        }

        input[type=text]:focus,
        input[type=number]:focus,
        select:focus,
        .sselect-input:focus {
            border-color: var(--accent);
            background: rgba(15, 21, 34, 0.9);
            box-shadow: 
                0 0 0 4px rgba(58, 110, 165, 0.2),
                0 4px 16px rgba(58, 110, 165, 0.15),
                inset 0 1px 2px rgba(0, 0, 0, 0.3);
            transform: translateY(-1px);
        }

        input[type=text]::placeholder,
        input[type=number]::placeholder,
        .sselect-input::placeholder {
            color: var(--muted);
            opacity: 1;
            font-weight: 500;
        }

        /* Buttons - Modern 3D effect */
        button {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 14px 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.3px;
            text-transform: none;
            box-shadow: 
                0 4px 12px rgba(58, 110, 165, 0.3),
                0 2px 4px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            background: linear-gradient(135deg, #4a7fb5 0%, var(--accent) 100%);
            box-shadow: 
                0 8px 24px rgba(58, 110, 165, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0px);
            box-shadow: 
                0 2px 8px rgba(58, 110, 165, 0.3),
                0 1px 2px rgba(0, 0, 0, 0.2),
                inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button:disabled:hover {
            transform: none;
        }

        /* Secondary (sand/gold) — Modern gradient */
        button.secondary {
            background: linear-gradient(135deg, var(--accent-alt) 0%, var(--accent-alt-strong) 100%);
            color: #1a1508;
            border: none;
            border-radius: var(--radius-sm);
            box-shadow: 
                0 4px 12px rgba(231, 198, 90, 0.3),
                0 2px 4px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        button.secondary:hover {
            background: linear-gradient(135deg, #f0d069 0%, var(--accent-alt) 100%);
            box-shadow: 
                0 8px 24px rgba(231, 198, 90, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        button.secondary:active {
            transform: translateY(0px);
            box-shadow: 
                0 2px 8px rgba(231, 198, 90, 0.3),
                0 1px 2px rgba(0, 0, 0, 0.2),
                inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        button.secondary:focus-visible {
            outline: none;
            box-shadow: 
                0 0 0 4px rgba(231, 198, 90, 0.4),
                0 8px 24px rgba(231, 198, 90, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Warn/Danger - Modern red gradient */
        button.warn {
            background: linear-gradient(135deg, #d88686 0%, var(--danger) 100%);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            box-shadow: 
                0 4px 12px rgba(194, 109, 109, 0.3),
                0 2px 4px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        button.warn:hover {
            background: linear-gradient(135deg, var(--danger) 0%, #b25f5f 100%);
            box-shadow: 
                0 8px 24px rgba(194, 109, 109, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        button.warn:active {
            transform: translateY(0px);
            box-shadow: 
                0 2px 8px rgba(194, 109, 109, 0.3),
                0 1px 2px rgba(0, 0, 0, 0.2),
                inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Layout - Modern grid */
        main {
            width: 100%;
            flex: 1;
            padding: 32px 0;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            padding: 0;
        }

        @media (min-width: 1024px) {
            .layout {
                grid-template-columns: 320px 1fr;
                gap: 32px;
            }
        }

        /* Navigation - Modern sidebar */
        nav {
            background: rgba(15, 21, 34, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-soft);
            height: fit-content;
            position: sticky;
            top: 100px;
            transition: all 0.3s ease;
        }

        nav:hover {
            background: rgba(15, 21, 34, 0.85);
            border-color: var(--border);
        }

        .nav-title {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 20px 0 12px 0;
            padding: 0 12px;
            text-align: left;
            opacity: 0.8;
        }

        .nav-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 14px 16px;
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn:hover {
            background: rgba(58, 110, 165, 0.1);
            color: #ffffff;
            transform: translateX(4px);
        }

        .nav-btn.active {
            background: linear-gradient(90deg, rgba(58, 110, 165, 0.15), rgba(58, 110, 165, 0.05));
            color: #ffffff;
            font-weight: 600;
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 2px 8px rgba(58, 110, 165, 0.2);
        }

        .nav-btn.active::before {
            transform: scaleY(1);
        }

        /* Panel - Modern glassmorphism */
        section.panel {
            background: rgba(15, 21, 34, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 32px;
            min-height: 60dvh;
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        section.panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-light), transparent);
        }

        section.panel:hover {
            border-color: var(--border);
            box-shadow: var(--shadow);
        }

        /* Toolbar - Modern header */
        .toolbar {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            margin: -32px -32px 28px -32px;
            padding: 20px 32px;
            border-bottom: 1px solid var(--border-light);
            background: linear-gradient(135deg, rgba(58, 110, 165, 0.1) 0%, rgba(231, 198, 90, 0.05) 100%);
            border-radius: var(--radius) var(--radius) 0 0;
            position: relative;
        }

        .toolbar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 32px;
            right: 32px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .toolbar strong {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(58, 110, 165, 0.15);
            color: var(--accent);
            border: 1px solid rgba(58, 110, 165, 0.3);
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            padding: 12px 16px;
            background: rgba(58, 110, 165, 0.05);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-sm);
            margin: 16px 0;
        }

        /* Center helpers */
        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 24px;
        }

        .row.center {
            justify-content: center;
        }

        /* Card pulse animation */
        @keyframes pulse {
            0%, 100% {
                box-shadow: var(--shadow-soft);
            }
            50% {
                box-shadow: 0 0 0 4px rgba(58, 110, 165, 0.3), var(--shadow-hover);
            }
        }

        .card--pulse {
            animation: pulse 0.9s ease-in-out;
        }

        /* Form elements in table */
        table input,
        table select {
            background: rgba(15, 21, 34, 0.8);
            border: 1px solid var(--border-light);
            padding: 10px 14px;
            font-size: 14px;
        }

        table input:focus,
        table select:focus {
            background: rgba(15, 21, 34, 0.95);
            border-color: var(--accent);
        }

        /* Checkbox styling */
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent);
            border-radius: 4px;
        }

        /* Columns layout */
        .cols-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        @media (max-width: 768px) {
            .cols-2 {
                grid-template-columns: 1fr;
            }
        }

        /* Labels - Modern styling */
        label {
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 8px;
            display: block;
        }

        /* Toolbar aligned row */
        .toolbar-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
        }

        .toolbar-row .group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(58, 110, 165, 0.05);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
        }

        .toolbar-row label {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .toolbar-row .sselect {
            width: 280px;
        }

        .toolbar-row button {
            min-height: 48px;
            border-radius: var(--radius-sm);
        }

        /* Tables - Modern design */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid var(--border-light);
            background: rgba(11, 18, 32, 0.6);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        th,
        td {
            border-bottom: 1px solid var(--border-light);
            padding: 16px;
            white-space: nowrap;
            text-align: center;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        th {
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, rgba(58, 110, 165, 0.15) 0%, rgba(58, 110, 165, 0.05) 100%);
            color: #d2e7ff;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(58, 110, 165, 0.15);
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(58, 110, 165, 0.2);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td.lab {
            background: linear-gradient(135deg, rgba(231, 198, 90, 0.2) 0%, rgba(213, 179, 78, 0.15) 100%);
            color: var(--accent-alt);
            font-weight: 700;
            border-left: 3px solid var(--accent-alt-strong);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        /* Chips - Modern badges */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 8px 14px;
            margin: 6px 4px;
            background: rgba(58, 110, 165, 0.15);
            color: #dbeafe;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 
                0 2px 8px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .chip:hover {
            background: rgba(58, 110, 165, 0.25);
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 
                0 4px 12px rgba(58, 110, 165, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .chip button {
            background: transparent;
            border: 0;
            color: #ff9999;
            cursor: pointer;
            padding: 0 4px 0 8px;
            font-weight: 700;
            font-size: 16px;
            line-height: 1;
            transition: all 0.2s ease;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .chip button:hover {
            background: rgba(194, 109, 109, 0.2);
            color: #ff6666;
            transform: scale(1.1);
        }

        /* SearchableSelect - Modern dropdown */
        .sselect {
            width: 260px;
            position: relative;
        }

        .sselect-input {
            border-radius: var(--radius-sm);
            padding-right: 40px;
        }

        .sselect-list {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(15, 21, 34, 0.95);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-height: 280px;
            overflow-y: auto;
            overflow-x: hidden;
            display: none;
            z-index: 100;
            box-shadow: var(--shadow);
            margin-top: 4px;
        }

        .sselect-list::-webkit-scrollbar {
            width: 8px;
        }

        .sselect-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .sselect-list::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        .sselect-list::-webkit-scrollbar-thumb:hover {
            background: var(--accent-strong);
        }

        .sselect-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .sselect-item:hover,
        .sselect-item--hi {
            background: rgba(58, 110, 165, 0.2);
            color: #ffffff;
            padding-left: 20px;
        }

        .sselect-item:last-child {
            border-bottom: none;
        }

        /* Modal - Modern glassmorphism */
        .modal.hidden {
            display: none;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal__backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }

        .modal__panel {
            position: relative;
            width: min(560px, 92vw);
            max-height: 90vh;
            background: rgba(15, 21, 34, 0.95);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 28px;

<body>

    </main>

    <script>
        // ---------- Easter egg secret ----------
        const secretCode = "favourite";
        let inputSequence = [];
        const maxLength = secretCode.length;

        window.addEventListener("keydown", (event) => {
            inputSequence.push(event.key.toLowerCase());
            if (inputSequence.length > maxLength) {
                inputSequence.shift();
            }
            if (inputSequence.join("") === secretCode) {
                alert("Santoor Mummy is the best!");
                inputSequence = [];
            }
        });

        const preferredTeacher = 'shwetha k r'; // case-insensitive match
        function pickPreferredTeacher(teachersArray) {
            if (!Array.isArray(teachersArray) || !teachersArray.length) return '';
            const idx = teachersArray.findIndex(t => String(t).toLowerCase() === preferredTeacher.toLowerCase());
            return idx >= 0 ? teachersArray[idx] : teachersArray[0];
        }

        // ---------- State and API ----------
        const API = {
            semesters: "/config/semesters_sections",
            subjectsPerSemester: "/config/subjects_per_semester",
            teachers: "/config/teacher_assignments",
            prebooked: "/config/prebooked",
            labs: "/config/lab_subjects",
            constants: "/config/constants",
            generate: "/generate",
        };
        // ---------- Storage & Sync Manager ----------
        const StorageManager = {
            STORAGE_PREFIX: 'tt_config_',
            SYNC_QUEUE_KEY: 'tt_sync_queue',
            LAST_SYNC_KEY: 'tt_last_sync',
            
            // Save data to localStorage
            saveLocal(key, data) {
                try {
                    const storageKey = this.STORAGE_PREFIX + key;
                    localStorage.setItem(storageKey, JSON.stringify({
                        data,
                        timestamp: Date.now(),
                        version: 1
                    }));
                    console.log(`[Storage] Saved ${key} to localStorage`);
                    return true;
                } catch (e) {
                    console.error(`[Storage] Failed to save ${key}:`, e);
                    // Handle quota exceeded
                    if (e.name === 'QuotaExceededError') {
                        alert('LocalStorage is full! Please clear some data or use a different browser.');
                    }
                    return false;
                }
            },
            
            // Load data from localStorage
            loadLocal(key) {
                try {
                    const storageKey = this.STORAGE_PREFIX + key;
                    const stored = localStorage.getItem(storageKey);
                    if (!stored) return null;
                    const parsed = JSON.parse(stored);
                    return parsed.data;
                } catch (e) {
                    console.error(`[Storage] Failed to load ${key}:`, e);
                    return null;
                }
            },
            
            // Load all cached data from localStorage
            loadAllLocal() {
                const keys = ['semesters', 'subjects', 'teachers', 'labs', 'prebooked', 'constants'];
                const loaded = {};
                keys.forEach(key => {
                    const data = this.loadLocal(key);
                    if (data !== null) {
                        loaded[key] = data;
                    }
                });
                return loaded;
            },
            
            // Add to sync queue (for retry on network restore)
            addToSyncQueue(path, data) {
                try {
                    const queue = this.getSyncQueue();
                    // Remove existing entry for same path to avoid duplicates
                    const filtered = queue.filter(item => item.path !== path);
                    filtered.push({
                        path,
                        data,
                        timestamp: Date.now(),
                        retries: 0
                    });
                    localStorage.setItem(this.SYNC_QUEUE_KEY, JSON.stringify(filtered));
                    console.log(`[Sync] Added to queue: ${path}`);
                    return true;
                } catch (e) {
                    console.error('[Sync] Failed to add to queue:', e);
                    return false;
                }
            },
            
            // Get sync queue
            getSyncQueue() {
                try {
                    const queue = localStorage.getItem(this.SYNC_QUEUE_KEY);
                    return queue ? JSON.parse(queue) : [];
                } catch (e) {
                    return [];
                }
            },
            
            // Clear sync queue
            clearSyncQueue() {
                localStorage.removeItem(this.SYNC_QUEUE_KEY);
            },
            
            // Process sync queue (retry failed saves)
            async processSyncQueue() {
                const queue = this.getSyncQueue();
                if (queue.length === 0) return;
                
                console.log(`[Sync] Processing ${queue.length} queued items...`);
                const remaining = [];
                
                for (const item of queue) {
                    try {
                        // Constants endpoint sends data directly, others wrap in {data: ...}
                        if (item.path.includes('constants')) {
                            await api(item.path, { method: 'PUT', body: item.data });
                        } else {
                            await api(item.path, { method: 'PUT', body: { data: item.data } });
                        }
                        console.log(`[Sync] Successfully synced ${item.path}`);
                    } catch (e) {
                        item.retries++;
                        if (item.retries < 5) { // Max 5 retries
                            remaining.push(item);
                            console.warn(`[Sync] Failed to sync ${item.path}, will retry (attempt ${item.retries})`);
                        } else {
                            console.error(`[Sync] Giving up on ${item.path} after ${item.retries} attempts`);
                        }
                    }
                }
                
                if (remaining.length > 0) {
                    localStorage.setItem(this.SYNC_QUEUE_KEY, JSON.stringify(remaining));
                } else {
                    this.clearSyncQueue();
                    localStorage.setItem(this.LAST_SYNC_KEY, Date.now().toString());
                }
                
                updateSyncStatus();
            },
            
            // Check if online
            isOnline() {
                return navigator.onLine;
            }
        };

        // Sync status indicator
        let syncStatusElement = null;
        function updateSyncStatus() {
            if (!syncStatusElement) {
                const header = document.querySelector('.header-inner');
                if (header) {
                    syncStatusElement = document.createElement('div');
                    syncStatusElement.style.cssText = `
                        padding: 8px 16px;
                        border-radius: 20px;
                        font-size: 12px;
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        font-weight: 600;
                        text-transform: uppercase;
                        letter-spacing: 0.5px;
                        backdrop-filter: blur(10px);
                        border: 1px solid rgba(255, 255, 255, 0.1);
                        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
                        transition: all 0.3s ease;
                    `;
                    header.appendChild(syncStatusElement);
                }
            }
            
            if (!syncStatusElement) return;
            
            const queue = StorageManager.getSyncQueue();
            const isOnline = StorageManager.isOnline();
            const hasPending = queue.length > 0;
            
            if (!isOnline) {
                syncStatusElement.innerHTML = '🔴 Offline';
                syncStatusElement.style.background = 'linear-gradient(135deg, rgba(194, 109, 109, 0.2) 0%, rgba(194, 109, 109, 0.1) 100%)';
                syncStatusElement.style.color = '#ff9999';
                syncStatusElement.style.borderColor = 'rgba(194, 109, 109, 0.4)';
                syncStatusElement.title = 'No internet connection. Data is saved locally.';
            } else if (hasPending) {
                syncStatusElement.innerHTML = `🟡 Syncing (${queue.length} pending)`;
                syncStatusElement.style.background = 'linear-gradient(135deg, rgba(231, 198, 90, 0.2) 0%, rgba(231, 198, 90, 0.1) 100%)';
                syncStatusElement.style.color = 'var(--accent-alt)';
                syncStatusElement.style.borderColor = 'rgba(231, 198, 90, 0.4)';
                syncStatusElement.title = 'Syncing changes to server...';
            } else {
                syncStatusElement.innerHTML = '🟢 Synced';
                syncStatusElement.style.background = 'linear-gradient(135deg, rgba(43, 122, 120, 0.2) 0%, rgba(43, 122, 120, 0.1) 100%)';
                syncStatusElement.style.color = '#66cccc';
                syncStatusElement.style.borderColor = 'rgba(43, 122, 120, 0.4)';
                syncStatusElement.title = 'All changes synced to server';
            }
        }

        // Debounce utility for auto-save
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Auto-save function - debounced save that doesn't show alerts
        const autoSaveFunctions = {};
        
        function createAutoSave(path, cacheKey, getDataFn, statusFn = null) {
            const autoSaveKey = `${path}_${cacheKey}`;
            
            if (!autoSaveFunctions[autoSaveKey]) {
                autoSaveFunctions[autoSaveKey] = debounce(async () => {
                    try {
                        const data = getDataFn();
                        if (data === null || data === undefined) return;
                        
                        if (statusFn) statusFn('Saving...');
                        
                        const result = await apiWithStorage(
                            path,
                            { method: 'PUT', body: { data } },
                            cacheKey
                        );
                        
                        if (statusFn) {
                            if (result && result.savedLocally) {
                                statusFn('Saved locally (offline)');
                            } else {
                                statusFn('Auto-saved');
                                setTimeout(() => {
                                    try {
                                        const statusEl = document.getElementById('status');
                                        if (statusEl && statusEl.textContent === 'Auto-saved') {
                                            statusEl.textContent = 'Ready';
                                        }
                                    } catch (e) {}
                                }, 2000);
                            }
                        }
                    } catch (e) {
                        console.error(`[Auto-save] Failed for ${cacheKey}:`, e);
                        if (statusFn) statusFn('Save error');
                    }
                }, 1500); // Wait 1.5 seconds after last change
            }
            
            return autoSaveFunctions[autoSaveKey];
        }

        // Enhanced API function with auto-save to localStorage
        async function apiWithStorage(path, opts = {}, cacheKey = null) {
            const method = (opts.method || 'GET').toUpperCase();
            const isWrite = ['PUT', 'POST', 'PATCH', 'DELETE'].includes(method);
            
            try {
                // Try API call
                const result = await api(path, opts);
                
                // On successful write, save to localStorage and clear from queue
                if (isWrite && cacheKey && opts.body?.data !== undefined) {
                    StorageManager.saveLocal(cacheKey, opts.body.data);
                    // Remove from sync queue if it was there
                    const queue = StorageManager.getSyncQueue();
                    const filtered = queue.filter(item => item.path !== path);
                    if (filtered.length !== queue.length) {
                        localStorage.setItem(StorageManager.SYNC_QUEUE_KEY, JSON.stringify(filtered));
                        updateSyncStatus();
                    }
                }
                
                // On successful read, save to localStorage
                if (method === 'GET' && cacheKey) {
                    // Constants endpoint returns data directly, others wrap in {data: ...}
                    const dataToSave = result?.data !== undefined ? result.data : result;
                    if (dataToSave !== undefined && dataToSave !== null) {
                        StorageManager.saveLocal(cacheKey, dataToSave);
                    }
                }
                
                return result;
            } catch (e) {
                // Network error on write - save locally and queue for sync
                if (isWrite && cacheKey && opts.body?.data !== undefined) {
                    StorageManager.saveLocal(cacheKey, opts.body.data);
                    StorageManager.addToSyncQueue(path, opts.body.data);
                    updateSyncStatus();
                    
                    // Show user-friendly message
                    console.warn(`[Storage] Network error, saved locally. Will sync when online: ${e.message}`);
                    return { savedLocally: true, error: e.message };
                }
                
                // Network error on read - try loading from localStorage
                if (method === 'GET' && cacheKey) {
                    const localData = StorageManager.loadLocal(cacheKey);
                    if (localData !== null) {
                        console.log(`[Storage] Using cached data for ${cacheKey}`);
                        // Constants endpoint returns data directly, others wrap
                        if (path.includes('constants')) {
                            return { ...localData, fromCache: true };
                        }
                        return { data: localData, fromCache: true };
                    }
                }
                
                throw e;
            }
        }

        // Auto-sync when connection is restored
        window.addEventListener('online', () => {
            console.log('[Sync] Connection restored, syncing queued changes...');
            updateSyncStatus();
            StorageManager.processSyncQueue();
        });

        window.addEventListener('offline', () => {
            console.log('[Sync] Connection lost');
            updateSyncStatus();
        });

        // Periodic sync check (every 30 seconds)
        setInterval(() => {
            if (StorageManager.isOnline()) {
                StorageManager.processSyncQueue();
            }
        }, 30000);

        // Initialize sync status after a short delay to ensure DOM is ready
        setTimeout(() => {
            updateSyncStatus();
            // Try to sync any pending items on load
            if (StorageManager.isOnline()) {
                StorageManager.processSyncQueue();
            }
            
            // Add manual sync button
            const header = document.querySelector('.header-inner');
            if (header) {
                const syncBtn = document.createElement('button');
                syncBtn.textContent = '🔄 Sync Now';
                syncBtn.className = 'secondary';
                syncBtn.style.cssText = `
                    padding: 8px 16px;
                    font-size: 13px;
                    margin-left: 12px;
                    border-radius: var(--radius-sm);
                `;
                syncBtn.onclick = async () => {
                    syncBtn.disabled = true;
                    syncBtn.textContent = 'Syncing...';
                    try {
                        await StorageManager.processSyncQueue();
                        const queue = StorageManager.getSyncQueue();
                        if (queue.length === 0) {
                            alert('All changes synced!');
                        } else {
                            alert(`Synced successfully, but ${queue.length} items still pending.`);
                        }
                    } catch (e) {
                        alert('Sync failed: ' + e.message);
                    } finally {
                        syncBtn.disabled = false;
                        syncBtn.textContent = '🔄 Sync Now';
                        updateSyncStatus();
                    }
                };
                // Insert before sync status element
                const row = header.querySelector('.row');
                if (row) {
                    row.appendChild(syncBtn);
                } else {
                    header.appendChild(syncBtn);
                }
            }
        }, 500);

        const state = {
            baseUrl: localStorage.getItem("ttbaseurl") || "https://time-table-generator-ychu.onrender.com",
            active: 'semesters',
            cache: StorageManager.loadAllLocal(), // Load from localStorage first
            lists: { sections: [], subjectsBySemester: {}, teachers: [] },
        };
        // Ensure cache structure even if localStorage is empty
        state.cache.semesters = state.cache.semesters || null;
        state.cache.subjects = state.cache.subjects || null;
        state.cache.teachers = state.cache.teachers || null;
        state.cache.labs = state.cache.labs || null;
        state.cache.prebooked = state.cache.prebooked || null;
        state.cache.constants = state.cache.constants || null;
        async function api(path, opts = {}) {
            const url = state.baseUrl + path;
            const hasBody = opts.body !== undefined && opts.body !== null;
            const method = (opts.method || 'GET').toUpperCase();
            const headers = {};
            if (hasBody && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) headers['Content-Type'] = 'application/json';
            const res = await fetch(url, { method, headers, body: hasBody ? JSON.stringify(opts.body) : undefined, mode: 'cors' });
            const text = await res.text();
            let data; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
            if (!res.ok) throw new Error(typeof data === 'string' ? data : (data?.detail || res.status + ' ' + res.statusText));
            return data;
        }
        const PATH = {
            semesters: '/config/semesters_sections',
            subjects: '/config/subjects_per_semester',
            teachers: '/config/teacher_assignments',
            labs: '/config/lab_subjects',
            prebooked: '/config/prebooked',
            constants: '/config/constants',
            generate: '/timetable/generate',
            getLabs: '/timetable/labs',
            getClasses: '/timetable/classes',
            export: '/timetable/export',
        };

        // ---------- Helpers ----------
        const days = ["Mon", "Tue", "Wed", "Thu", "Fri"];
        function buildSectionList(semestersMap) { const list = []; Object.entries(semestersMap || {}).forEach(([y, secs]) => secs.forEach(s => list.push(`${y}${s}`))); return list.sort(); }
        const unique = arr => Array.from(new Set(arr));
        function daysRow(len) { return Array.from({ length: len }).map((_, i) => `<th>P${i + 1}</th>`).join(''); }
        function buildTable(grid, title) {
            if (!grid || !grid.length) return '<div class="hint">Empty.</div>';
            const cols = grid[0].length;
            let html = `
                <div style="margin:24px 0 16px 0; padding:16px 20px; background:rgba(58, 110, 165, 0.1); border-left:4px solid var(--accent); border-radius:var(--radius-sm); font-size:18px; font-weight:700; color:#d2e7ff; letter-spacing:-0.3px">
                    ${title}
                </div>
                <table>
                    <thead><tr><th>Day \\ Period</th>${daysRow(cols)}</tr></thead>
                    <tbody>
            `;
            for (let d = 0; d < grid.length; d++) {
                html += `<tr><td style="font-weight:600; color:#d2e7ff">${days[d] || ('D' + (d + 1))}</td>`;
                for (let p = 0; p < cols; p++) {
                    const cell = grid[d][p];
                    const isLab = cell === 'LAB';
                    const text = isLab ? 'LAB' : (cell ? String(cell).slice(0, 30) : '-');
                    html += `<td class="${isLab ? 'lab' : ''}" title="${isLab ? 'LAB' : (cell || '')}" style="font-size:13px; font-weight:${isLab ? '700' : '500'}">${text}</td>`;
                }
                html += `</tr>`;
            }
            html += `</tbody></table>`;
            return html;
        }
        function semesterFromSec(sid) { return String(sid || '').match(/^\d+/)?.[0] || ''; }

        // ---------- Searchable Select ----------
        function searchableSelect(container, options, initialValue, onChange, placeholder = "Search...") {
            container.innerHTML = `
    <div class="sselect" style="position:relative; min-width:220px;">
      <input type="text" class="sselect-input" placeholder="${placeholder}" style="width:100%; padding-right:28px;">
      <div class="sselect-list" style="position:absolute; top:40px; left:0; right:0; background:var(--card); border:1px solid var(--border); border-radius:8px; max-height:220px; overflow:auto; display:none; z-index:20"></div>
      <div class="sselect-value" style="display:none"></div>
    </div>
  `;

            const input = container.querySelector('.sselect-input');
            const list = container.querySelector('.sselect-list');
            const valueEl = container.querySelector('.sselect-value');

            let data = Array.isArray(options) ? options.slice() : [];
            let current = initialValue && data.includes(initialValue) ? initialValue : (data[0] || '');
            let fil = '';           // current filter string
            let hi = -1;            // highlighted index in filtered list

            function filtered() {
                const f = fil.trim().toLowerCase();
                return f ? data.filter(x => x.toLowerCase().includes(f)) : data.slice();
            }

            function renderList() {
                const arr = filtered();
                if (!arr.length) {

            function updateHi() {
                list.querySelectorAll('.sselect-item').forEach((el, i) => {
                    if (i === hi) el.classList.add('sselect-item--hi');
                    else el.classList.remove('sselect-item--hi');
                });

            function openList() {
                renderList();
                list.style.display = 'block';
            }

            function closeList() {
                list.style.display = 'none';
                hi = -1;
            }

            function select(v) {
                current = v || '';
                input.value = current;       // show selection IN the textbox
                valueEl.textContent = current; // keep hidden value span in sync for existing code
                closeList();
                if (typeof onChange === 'function') onChange(current);
            }

            // Initialize input with current selection
            input.value = current;
            valueEl.textContent = current;

            // Events
            input.addEventListener('focus', () => {
                fil = '';
                openList();
            });

            input.addEventListener('input', () => {
                fil = input.value;
                hi = 0;
                openList();
            });

            input.addEventListener('keydown', (e) => {
                const arr = filtered();
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (!arr.length) return;
                    hi = (hi + 1) % arr.length;
                    renderList(); updateHi();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (!arr.length) return;
                    hi = (hi <= 0 ? arr.length - 1 : hi - 1);
                    renderList(); updateHi();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (arr.length) select(arr[hi >= 0 ? hi : 0]);
                } else if (e.key === 'Escape') {
                    e.preventDefault(); closeList();
                }
            });

            // Allow clicking an option after input loses focus
            input.addEventListener('blur', () => {
                setTimeout(() => closeList(), 150);
            });

            // Public API (backward compatible)
            return {
                get value() { return current; },
                set value(v) {
                    current = v || '';
                    input.value = current;
                    valueEl.textContent = current;
                },
                setOptions(opts) {
                    data = Array.isArray(opts) ? opts.slice() : [];
                    // If current is no longer valid, reset to first option

                        current = data[0] || '';
                        input.value = current;

                    function addRow(secVal = '', subjVal = '') {
                        const tr = document.createElement('tr');
                        const td1 = document.createElement('td');
                        const td2 = document.createElement('td');
                        const td3 = document.createElement('td');
                        const secHost = document.createElement('div');
                        td1.appendChild(secHost);
                        const subjHost = document.createElement('div');
                        td2.appendChild(subjHost);
                        
                        const initSemester = (String(secVal || sections[0] || '').match(/^\d+/) || [''])[0];
                        const initSubs = Object.keys(state.lists.subjectsBySemester[initSemester] || {});
                        
                        // Create subject select first (will be updated by section select)
                        let subjSS = searchableSelect(subjHost, initSubs, subjVal || initSubs[0] || '', (v) => {
                            collectAndSaveTeachers();
                        }, "Search subject...");
                        
                        // Create section select with reference to subject select
                        const secSS = searchableSelect(secHost, sections, secVal || sections[0] || '', (newSec) => {
                            const s = (String(newSec).match(/^\d+/) || [''])[0];
                            const subs = Object.keys(state.lists.subjectsBySemester[s] || {});
                            subjSS.setOptions(subs);
                            if (subs.length && !subs.includes(subjSS.value)) subjSS.value = subs[0];
                            collectAndSaveTeachers();
                        }, "Search section...");
                        
                        const del = document.createElement('button'); 
                        del.textContent = 'Delete'; 
                        del.className = 'warn'; 
                        del.onclick = () => {
                            tr.remove();
                            collectAndSaveTeachers();
                        };
                        td3.appendChild(del);
                        tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
                        tbody.appendChild(tr);
                    }

                    (data[t] || []).forEach(([sec, subj]) => addRow(sec, subj));
                    card.querySelector('button[data-add]').onclick = () => {
                        addRow();

                    };
                    card.querySelector('button[data-del]').onclick = () => { 
                        delete state.cache.teachers[t]; 
                        draw();
                        collectAndSaveTeachers();
                    };

                const names = Object.keys(state.cache.teachers || {}).sort();

                if (!findSS) {
                    findSS = searchableSelect(document.getElementById('findHost'), names, defaultFind, (val) => scrollToTeacher(val), "Search teacher...");

                    findSS.setOptions(names);
                    findSS.value = defaultFind; // keep default focused on preferred teacher
                }

            // Open add-teacher modal
            document.getElementById('btnAddTeacher').onclick = () => {
                document.getElementById('newTeacherName').value = '';
                modalOpen();

            // Modal wiring
            document.getElementById('modalClose').onclick = modalClose;
            document.getElementById('modalCancel').onclick = modalClose;
            document.getElementById('modalCreate').onclick = () => {
                const name = document.getElementById('newTeacherName').value.trim();
                if (!name) { alert('Please enter a name'); return; }
                state.cache.teachers = state.cache.teachers || {};
                if (!state.cache.teachers[name]) state.cache.teachers[name] = [];
                modalClose();
                draw();
                collectAndSaveTeachers();
                if (defaultFind) {
                    // Delay to ensure DOM is painted
                    requestAnimationFrame(() => scrollToTeacher(defaultFind));
                }
                scrollToTeacher(name);
            };
            modal.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal__backdrop')) modalClose();
            });
            window.addEventListener('keydown', (e) => { if (!modal.classList.contains('hidden') && e.key === 'Escape') modalClose(); });

            document.getElementById('syncNow').onclick = async () => {
                try {
                    const out = {};
                    wrap.querySelectorAll('[data-teacher]').forEach(card => {
                        const t = card.getAttribute('data-teacher');
                        const rows = [];
                        card.querySelectorAll('tbody tr').forEach(tr => {
                            const sec = tr.children[0].querySelector('.sselect-value')?.textContent.trim() || '';
                            const subj = tr.children[1].querySelector('.sselect-value')?.textContent.trim() || '';
                            if (sec && subj) rows.push([sec, subj]);
                        });
                        if (rows.length) out[t] = rows;
                    });
                    status.textContent = 'Syncing...';
                    const result = await apiWithStorage(
                        PATH.teachers, 
                        { method: 'PUT', body: { data: out } },
                        'teachers'
                    );
                    state.cache.teachers = out;
                    if (result && result.savedLocally) {
                        status.textContent = 'Queued for sync (offline)';
                    } else {
                        status.textContent = 'Synced';
                        setTimeout(() => { if (status) status.textContent = 'Ready'; }, 2000);
                    }
                } catch (e) { 
                    status.textContent = 'Sync error';
                    console.error('Sync failed:', e);
                }
            };
            document.getElementById('load').onclick = load;

            async function load() {
                try {
                    status.textContent = 'Loading...';
                    await ensureRefs();
                    
                    // Try to load from localStorage first
                    const localData = StorageManager.loadLocal('teachers');
                    if (localData !== null) {
                        state.cache.teachers = localData;
                        draw();
                        status.textContent = 'Loaded from cache';
                    }
                    
                    // Then try to sync with server
                    try {
                        const res = await apiWithStorage(PATH.teachers, {}, 'teachers');
                        if (res.fromCache) {
                            status.textContent = 'Loaded from cache (offline)';
                        } else {
                            state.cache.teachers = res?.data || state.cache.teachers || {};
                            draw();
                            status.textContent = 'Loaded & synced';
                        }
                    } catch (e) {
                        if (localData === null) throw e;
                        console.warn('Using cached data due to network error:', e);
                    }
                } catch (e) { status.textContent = 'Error'; alert('Load failed: ' + e.message); }
            }
            await load();
        }


        // Lab subjects
        async function renderLabs() {
            r(`
      <div class="toolbar"><strong style="margin-left:8px">Lab Subjects</strong>${statusBar()}</div>
      <div class="hint" style="margin:6px 0 10px">Changes are auto-saved.</div>
      <div class="row" style="gap:10px;margin-bottom:8px">

      </div>
      <table id="tbl"><thead><tr><th>Lab Name</th><th>Lab Teacher</th><th>Actions</th></tr></thead><tbody></tbody></table>

            const status = document.getElementById('status');

            const tbody = document.querySelector('#tbl tbody');

            // Helper to collect and save labs

            // Create auto-save function for labs

                PATH.labs,
                'labs',
                () => state.cache.labs || {},
                (msg) => { if (status) status.textContent = msg; }
            );

            async function ensureRefs() {
                if (!state.cache.semesters) { 
                    const localSemesters = StorageManager.loadLocal('semesters');
                    if (localSemesters) {
                        state.cache.semesters = localSemesters;
                    } else {
                        try {
                            const s = await apiWithStorage(PATH.semesters, {}, 'semesters');
                            state.cache.semesters = s?.data || s || {};

                tr.appendChild(tdTeacher); 
                tr.appendChild(tdAct);

            document.getElementById('addRow').onclick = () => addRow();
            document.getElementById('syncNow').onclick = async () => {

                    collectAndSaveLabs();
                    status.textContent = 'Syncing...';
                    const result = await apiWithStorage(
                        PATH.labs, 
                        { method: 'PUT', body: { data: state.cache.labs } },
                        'labs'
                    );
                    if (result && result.savedLocally) {
                        status.textContent = 'Queued for sync (offline)';
                    } else {
                        status.textContent = 'Synced';
                        setTimeout(() => { if (status) status.textContent = 'Ready'; }, 2000);
                    }
                } catch (e) { 
                    status.textContent = 'Sync error';
                    console.error('Sync failed:', e);

            };
            document.getElementById('load').onclick = load;

            async function load() {
                try {
                    status.textContent = 'Loading...';
                    await ensureRefs();
                    secSS = searchableSelect(secHost, state.lists.sections, state.lists.sections[0] || '', (val) => { 
                        currentSection = val; 
                        draw(val);
                    }, "Search section...");
                    
                    // Try to load from localStorage first
                    const localData = StorageManager.loadLocal('labs');
                    if (localData !== null) {
                        state.cache.labs = localData;
                        currentSection = secSS.value;
                        draw(currentSection);
                        status.textContent = 'Loaded from cache';
                    }
                    
                    // Then try to sync with server
                    try {
                        const res = await apiWithStorage(PATH.labs, {}, 'labs');
                        if (res.fromCache) {
                            status.textContent = 'Loaded from cache (offline)';
                        } else {
                            state.cache.labs = res?.data || state.cache.labs || {};
                            currentSection = secSS.value;
                            draw(currentSection);
                            status.textContent = 'Loaded & synced';
                        }
                    } catch (e) {
                        if (localData === null) throw e;
                        console.warn('Using cached data due to network error:', e);
                    }
                } catch (e) { status.textContent = 'Error'; alert('Load failed: ' + e.message); }
            }
            await load();
        }

        // Prebooked (Teacher + Section + Subject)
        async function renderPrebooked() {
            // Build panel
            panel.innerHTML = `
    <div class="toolbar"><strong>Prebooked Slots (Teacher + Section + Subject)</strong><span class="status" id="status"></span></div>
    <div class="hint" style="margin:6px 0 10px">Changes are auto-saved. Select a teacher first; only that teacher's assigned sections/subjects are available. Click cells to toggle exact prebooks.</div>
    <div class="center">
      <div class="toolbar-row" style="margin-bottom:8px">
        <div class="group"><label>Teacher</label><span id="tHost"></span></div>
        <div class="group"><label>Section</label><span id="sHost"></span></div>
        <div class="group"><label>Subject</label><span id="subHost"></span></div>
        <div class="group">
          <button id="syncNow">🔄 Sync Now</button>
          <button id="preLoad">Reload</button>
        </div>
      </div>
      <div id="grid" style="width:100%"></div>
