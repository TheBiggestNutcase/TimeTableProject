  `;

            // Grab DOM refs now that HTML is in place
            const status = document.getElementById('status');
            const tHost = document.getElementById('tHost');
            const sHost = document.getElementById('sHost');
            const subHost = document.getElementById('subHost');
            const grid = document.getElementById('grid');
            const chips = document.getElementById('chips');
            const btnSyncNow = document.getElementById('syncNow');
            const btnLoad = document.getElementById('preLoad');

            if (!status || !tHost || !sHost || !subHost || !grid || !chips || !btnSyncNow || !btnLoad) {
                throw new Error('Prebooked controls missing from DOM');
            }
            
            // Create auto-save function for prebooked
            const autoSave = createAutoSave(
                PATH.prebooked,
                'prebooked',
                () => state.cache.prebooked || {},
                (msg) => { if (status) status.textContent = msg; }
            );

            // Ensure prerequisites
            async function ensureRefs() {
                // Load from cache first, then try API
                if (!state.cache.constants) { 
                    const localConstants = StorageManager.loadLocal('constants');
                    if (localConstants) {
                        state.cache.constants = localConstants;
                    } else {
                        try {
                            const result = await apiWithStorage(PATH.constants, {}, 'constants');
                            // Constants endpoint returns data directly
                            state.cache.constants = result.fromCache ? result : (result || { DAYS: 5, PERIODS: 6, MAX_THEORY_PASSES: 10, DEBUG_PLACEMENT: true });
                        } catch (e) {
                            state.cache.constants = { DAYS: 5, PERIODS: 6, MAX_THEORY_PASSES: 10, DEBUG_PLACEMENT: true };
                        }
                    }
                }
                if (!state.cache.semesters) { 
                    const localSemesters = StorageManager.loadLocal('semesters');
                    if (localSemesters) {
                        state.cache.semesters = localSemesters;
                    } else {
                        try {
                            const s = await apiWithStorage(PATH.semesters, {}, 'semesters');
                            state.cache.semesters = s?.data || s || {};
                        } catch (e) {
                            state.cache.semesters = {};
                        }
                    }
                }
                if (!state.cache.subjects) { 
                    const localSubjects = StorageManager.loadLocal('subjects');
                    if (localSubjects) {
                        state.cache.subjects = localSubjects;
                    } else {
                        try {
                            const s = await apiWithStorage(PATH.subjects, {}, 'subjects');
                            state.cache.subjects = s?.data || s || {};
                        } catch (e) {
                            state.cache.subjects = {};
                        }
                    }
                    state.lists.subjectsBySemester = state.cache.subjects;
                }
                if (!state.cache.teachers) { 
                    const localTeachers = StorageManager.loadLocal('teachers');
                    if (localTeachers) {
                        state.cache.teachers = localTeachers;
                    } else {
                        try {
                            const t = await apiWithStorage(PATH.teachers, {}, 'teachers');
                            state.cache.teachers = t?.data || t || {};
                        } catch (e) {
                            state.cache.teachers = {};
                        }
                    }
                }
                if (!state.cache.prebooked) { 
                    const localPrebooked = StorageManager.loadLocal('prebooked');
                    if (localPrebooked) {
                        state.cache.prebooked = localPrebooked;
                    } else {
                        try {
                            const pb = await apiWithStorage(PATH.prebooked, {}, 'prebooked');
                            state.cache.prebooked = pb?.data || pb || {};
                        } catch (e) {
                            state.cache.prebooked = {};
                        }
                    }
                }
                state.lists.teachers = Object.keys(state.cache.teachers || {}).sort();
                state.lists.sections = Object.keys(state.cache.semesters || {}).flatMap(y => (state.cache.semesters[y] || []).map(s => `${y}${s}`)).sort();
                // Build byTeacher map
                const ta = state.cache.teachers;
                state.lists.byTeacher = {};
                Object.keys(ta || {}).forEach(T => {
                    const pairs = ta[T] || [];
                    state.lists.byTeacher[T] = pairs.map(([sec, subj]) => ({ section_id: sec, subject: subj }));
                });
            }

            // Helpers derived from teacher selection
            function optionsForTeacher(T) {
                const items = state.lists.byTeacher[T] || [];
                const sections = Array.from(new Set(items.map(x => x.section_id))).sort();
                const subjectsBySection = {};
                sections.forEach(sec => {
                    subjectsBySection[sec] = items.filter(x => x.section_id === sec).map(x => x.subject).sort();
                });
                return { sections, subjectsBySection };
            }

            function entriesFor(teacher, section, subject) {
                const all = state.cache.prebooked[teacher] || [];
                const set = new Set();
                for (const e of all) {
                    if (Array.isArray(e) && e.length >= 2) {
                        // legacy generic block, ignore for trio-specific
                        continue;
                    } else if (e && typeof e === 'object') {
                        if (e.section_id === section && e.subject === subject) {
                            set.add(`${e.day}-${e.period}`);
                        }
                    }
                }
                return set;
            }

            function toggleEntry(teacher, day, period, section, subject, makeOn) {
                const arr = state.cache.prebooked[teacher] || [];
                const idx = arr.findIndex(e => e && typeof e === 'object' && e.day === day && e.period === period && e.section_id === section && e.subject === subject);
                if (makeOn && idx === -1) { arr.push({ day, period, section_id: section, subject }); }
                if (!makeOn && idx > -1) { arr.splice(idx, 1); }
                state.cache.prebooked[teacher] = arr;
                autoSave();
            }

            function drawGrid(teacher, section, subject) {
                const DAYS = state.cache.constants.DAYS || 5;
                const PERIODS = state.cache.constants.PERIODS || 6;
                grid.innerHTML = '';
                if (!teacher || !section || !subject) return;
                const selectedSet = entriesFor(teacher, section, subject);
                const tbl = document.createElement('table');
                let thead = `<thead><tr><th>Day \\ Period</th>${Array.from({ length: PERIODS }).map((_, i) => `<th>P${i + 1}</th>`).join('')}</tr></thead>`;
                let tbody = '<tbody>';
                for (let d = 0; d < DAYS; d++) {
                    tbody += `<tr><td>${["Mon", "Tue", "Wed", "Thu", "Fri"][d] || ('D' + (d + 1))}</td>`;
                    for (let p = 0; p < PERIODS; p++) {
                        const key = `${d}-${p}`;
                        const checked = selectedSet.has(key) ? 'checked' : '';
                        tbody += `<td><input type="checkbox" data-d="${d}" data-p="${p}" ${checked}></td>`;
                    }
                    tbody += `</tr>`;
                }
                tbody += '</tbody>';
                tbl.innerHTML = thead + tbody;
                grid.appendChild(tbl);

                grid.querySelectorAll('input[type=checkbox]').forEach(cb => {
                    cb.onchange = () => {
                        const d = parseInt(cb.getAttribute('data-d'), 10);
                        const p = parseInt(cb.getAttribute('data-p'), 10);
                        toggleEntry(tSS.value, d, p, sSS.value, subSS.value, cb.checked);
                        drawChips(tSS.value);
                    };
                });
            }

            function drawChips(teacher) {
                const all = state.cache.prebooked[teacher] || [];
                const list = [];
                for (const e of all) {
                    if (Array.isArray(e) && e.length >= 2) {
                        list.push({ day: e[0], period: e[1], section_id: '-', subject: '(ANY)' }); // legacy
                    } else if (e && typeof e === 'object') {
                        list.push(e);
                    }
                }
                list.sort((a, b) => (a.section_id + a.subject).localeCompare(b.section_id + b.subject) || a.day - b.day || a.period - b.period);
                chips.innerHTML = list.length ? list.map((e, i) => `
      <span class="chip">
        ${["Mon", "Tue", "Wed", "Thu", "Fri"][e.day] || ('D' + (e.day + 1))} P${e.period + 1} • ${e.section_id} • ${e.subject}
        <button data-i="${i}">×</button>
      </span>
    `).join(' ') : '<span class="hint">No prebooks yet</span>';

                chips.querySelectorAll('button[data-i]').forEach(btn => {
                    btn.onclick = () => {
                        const i = parseInt(btn.getAttribute('data-i'), 10);
                        const arr = state.cache.prebooked[teacher] || [];
                        let count = -1;
                        for (let k = 0; k < arr.length; k++) {
                            const e = arr[k];
                            if (Array.isArray(e) || (e && typeof e === 'object')) {
                                count++;
                                if (count === i) { arr.splice(k, 1); break; }
                            }
                        }
                        state.cache.prebooked[teacher] = arr;
                        drawGrid(tSS.value, sSS.value, subSS.value);
                        drawChips(teacher);
                        autoSave();
                    };
                });
            }

            // Build selectors
            await (async () => {
                try {
                    status.textContent = 'Loading...';
                    await ensureRefs();
                    const defaultT = pickPreferredTeacher(state.lists.teachers);

                    // Teacher select
                    let tSS = searchableSelect(tHost, state.lists.teachers, defaultT, onTeacherChange, "Search teacher...");
                    // Section select (populated after teacher)
                    let sSS = searchableSelect(sHost, [], '', onSectionChange, "Search section...");
                    // Subject select (depends on section)
                    let subSS = searchableSelect(subHost, [], '', onSubjectChange, "Search subject...");

                    // Expose to inner helpers
                    window.tSS = tSS; window.sSS = sSS; window.subSS = subSS;

                    // Initial populate based on default teacher
                    onTeacherChange(tSS.value);

                    function onTeacherChange(T) {
                        const { sections, subjectsBySection } = optionsForTeacher(T);
                        sSS.setOptions(sections);
                        sSS.value = sections[0] || '';
                        const subs = subjectsBySection[sSS.value] || [];
                        subSS.setOptions(subs);
                        subSS.value = subs[0] || '';
                        drawGrid(tSS.value, sSS.value, subSS.value);
                        drawChips(tSS.value);
                    }
                    function onSectionChange(sec) {
                        const { subjectsBySection } = optionsForTeacher(tSS.value);
                        const subs2 = subjectsBySection[sec] || [];
                        subSS.setOptions(subs2);
                        if (subs2.length && !subs2.includes(subSS.value)) subSS.value = subs2[0];
                        drawGrid(tSS.value, sSS.value, subSS.value);
                        drawChips(tSS.value);
                    }
                    function onSubjectChange(_) {
                        drawGrid(tSS.value, sSS.value, subSS.value);
                        drawChips(tSS.value);
                    }

                    // Bind sync/reload
                    btnSyncNow.onclick = async () => {
                        try {
                            status.textContent = 'Syncing...';
                            const result = await apiWithStorage(
                                PATH.prebooked, 
                                { method: 'PUT', body: { data: state.cache.prebooked || {} } },
                                'prebooked'
                            );
                            if (result && result.savedLocally) {
                                status.textContent = 'Queued for sync (offline)';
                            } else {
                                status.textContent = 'Synced';
                                setTimeout(() => { if (status) status.textContent = 'Ready'; }, 2000);
                            }
                        } catch (e) { 
                            status.textContent = 'Sync error';
                            console.error('Sync failed:', e);
                        }
                    };
                    btnLoad.onclick = async () => {
                        try {
                            status.textContent = 'Loading...';
                            
                            // Try to load from localStorage first
                            const localData = StorageManager.loadLocal('prebooked');
                            if (localData !== null) {
                                state.cache.prebooked = localData;
                                drawGrid(tSS.value, sSS.value, subSS.value);
                                drawChips(tSS.value);
                                status.textContent = 'Loaded from cache';
                            }
                            
                            // Then try to sync with server
                            try {
                                const pb = await apiWithStorage(PATH.prebooked, {}, 'prebooked');
                                if (pb.fromCache) {
                                    status.textContent = 'Loaded from cache (offline)';
                                } else {
                                    state.cache.prebooked = pb?.data || state.cache.prebooked || {};
                                    drawGrid(tSS.value, sSS.value, subSS.value);
                                    drawChips(tSS.value);
                                    status.textContent = 'Loaded & synced';
                                }
                            } catch (e) {
                                if (localData === null) throw e;
                                console.warn('Using cached data due to network error:', e);
                            }
                        } catch (e) { status.textContent = 'Error'; alert('Reload failed: ' + e.message); }
                    };

                    status.textContent = 'Loaded';
                } catch (e) {
                    status.textContent = 'Error';
                    panel.innerHTML += `<div style="padding:12px;color:#fca5a5">Prebooked UI failed: ${e.message}</div>`;
                    console.error('[Prebooked] init error:', e);
                }
            })();
        }



        // Constants
        async function renderConstants() {
            r(`
      <div class="toolbar"><strong style="margin-left:8px">Constants</strong>${statusBar()}</div>
      <div class="hint" style="margin:6px 0 10px">Changes are auto-saved.</div>
      <div class="cols-2">
        <div>
          <label>DAYS</label><input id="c_days" type="number" min="1" />
          <label>PERIODS</label><input id="c_periods" type="number" min="1" />
          <label>MAX_THEORY_PASSES</label><input id="c_passes" type="number" min="1" />
          <label>DEBUG_PLACEMENT</label><select id="c_debug"><option value="true">true</option><option value="false">false</option></select>
          <div class="row" style="margin-top:10px">
            <button id="btnLoad" class="secondary">Load</button>
            <button id="syncNow">🔄 Sync Now</button>
          </div>
        </div>
        <div><div class="hint">Controls days, periods, and iteration passes for scheduling.</div></div>
      </div>
    `);
            const status = document.getElementById('status');
            const ids = (k) => document.getElementById(k);
            
            // Helper function to get constants payload
            function getConstantsPayload() {
                return {
                    DAYS: parseInt(ids('c_days').value, 10) || 5,
                    PERIODS: parseInt(ids('c_periods').value, 10) || 6,
                    MAX_THEORY_PASSES: parseInt(ids('c_passes').value, 10) || 10,
                    DEBUG_PLACEMENT: ids('c_debug').value === 'true'
                };
            }
            
            // Create auto-save function for constants (special handling - constants sent directly, not wrapped)
            const autoSaveConstants = debounce(async () => {
                try {
                    const payload = getConstantsPayload();
                    state.cache.constants = payload;
                    if (status) status.textContent = 'Saving...';
                    
                    // Constants endpoint sends payload directly (not wrapped in {data: ...})
                    try {
                        await api(PATH.constants, { method: 'PUT', body: payload });
                        // Save to localStorage and clear from sync queue on success
                        StorageManager.saveLocal('constants', payload);
                        const queue = StorageManager.getSyncQueue();
                        const filtered = queue.filter(item => item.path !== PATH.constants);
                        if (filtered.length !== queue.length) {
                            localStorage.setItem(StorageManager.SYNC_QUEUE_KEY, JSON.stringify(filtered));
                            updateSyncStatus();
                        }
                        
                        if (status) {
                            status.textContent = 'Auto-saved';
                            setTimeout(() => {
                                const statusEl = document.getElementById('status');
                                if (statusEl && statusEl.textContent === 'Auto-saved') {
                                    statusEl.textContent = 'Ready';
                                }
                            }, 2000);
                        }
                    } catch (e) {
                        // Network error - save locally and queue for sync
                        StorageManager.saveLocal('constants', payload);
                        StorageManager.addToSyncQueue(PATH.constants, payload);
                        updateSyncStatus();
                        if (status) status.textContent = 'Saved locally (offline)';
                    }
                } catch (e) {
                    console.error('[Auto-save] Failed for constants:', e);
                    const payload = getConstantsPayload();
                    state.cache.constants = payload;
                    StorageManager.saveLocal('constants', payload);
                    if (status) status.textContent = 'Save error';
                }
            }, 1500);
            
            // Add auto-save listeners to all inputs
            ['c_days', 'c_periods', 'c_passes', 'c_debug'].forEach(id => {
                const el = ids(id);
                if (el) {
                    el.addEventListener('input', () => {
                        state.cache.constants = getConstantsPayload();
                        autoSaveConstants();
                    });
                    el.addEventListener('change', () => {
                        state.cache.constants = getConstantsPayload();
                        autoSaveConstants();
                    });
                }
            });

            document.getElementById('btnLoad').onclick = async () => {
                try {
                    status.textContent = 'Loading...';
                    
                    // Try to load from localStorage first
                    const localData = StorageManager.loadLocal('constants');
                    if (localData !== null) {
                        const c = localData;
                        ids('c_days').value = c.DAYS; ids('c_periods').value = c.PERIODS; ids('c_passes').value = c.MAX_THEORY_PASSES; ids('c_debug').value = String(c.DEBUG_PLACEMENT);
                        state.cache.constants = c;
                        status.textContent = 'Loaded from cache';
                    }
                    
                    // Then try to sync with server
                    try {
                        const c = await apiWithStorage(PATH.constants, {}, 'constants');
                        // Constants endpoint returns data directly, not wrapped
                        const constantsData = c.fromCache ? c : (c || {});
                        if (!c.fromCache || !localData) {
                            ids('c_days').value = constantsData.DAYS || 5; 
                            ids('c_periods').value = constantsData.PERIODS || 6; 
                            ids('c_passes').value = constantsData.MAX_THEORY_PASSES || 10; 
                            ids('c_debug').value = String(constantsData.DEBUG_PLACEMENT !== undefined ? constantsData.DEBUG_PLACEMENT : true);
                            state.cache.constants = constantsData;
                            status.textContent = c.fromCache ? 'Loaded from cache (offline)' : 'Loaded & synced';
                        }
                    } catch (e) {
                        if (localData === null) throw e;
                        console.warn('Using cached data due to network error:', e);
                    }
                } catch (e) { status.textContent = 'Error'; alert('Load failed: ' + e.message); }
            };
            document.getElementById('syncNow').onclick = async () => {
                try {
                    const payload = { 
                        DAYS: parseInt(ids('c_days').value, 10) || 5, 
                        PERIODS: parseInt(ids('c_periods').value, 10) || 6, 
                        MAX_THEORY_PASSES: parseInt(ids('c_passes').value, 10) || 10, 
                        DEBUG_PLACEMENT: ids('c_debug').value === 'true' 
                    };
                    status.textContent = 'Syncing...';
                    const result = await apiWithStorage(
                        PATH.constants, 
                        { method: 'PUT', body: payload },
                        'constants'
                    );
                    // For constants, the API doesn't return data in the same format, so we save the payload
                    StorageManager.saveLocal('constants', payload);
                    state.cache.constants = payload;
                    if (result && result.savedLocally) {
                        status.textContent = 'Queued for sync (offline)';
                    } else {
                        status.textContent = 'Synced';
                        setTimeout(() => { if (status) status.textContent = 'Ready'; }, 2000);
                    }
                } catch (e) { 
                    status.textContent = 'Sync error';
                    console.error('Sync failed:', e);
                }
            };

            if (state.cache.constants) {
                const c = state.cache.constants; ids('c_days').value = c.DAYS; ids('c_periods').value = c.PERIODS; ids('c_passes').value = c.MAX_THEORY_PASSES; ids('c_debug').value = String(c.DEBUG_PLACEMENT);
            } else {
                document.getElementById('btnLoad').click();
            }
        }

        // Generate and display results inline
        function renderGenerate() {
            r(`
      <div class="toolbar"><strong style="margin-left:8px">Generate Timetable</strong><span class="status" id="status"></span></div>
      <div class="row" style="gap:10px;margin-top:6px">
        <label>Seed <input id="g_seed" type="number" value="12" style="width:120px"></label>
        <label>Max Passes Override <input id="g_pass" type="number" placeholder="(optional)" style="width:160px"></label>
        <button id="btnGen" class="secondary">Generate</button>
      </div>
      <div id="results" style="margin-top:14px"></div>
    `);
            const status = document.getElementById('status');
            const results = document.getElementById('results');

            function buildHtmlFromCombined(combined) {
                let html = '';
                const sections = Object.keys(combined || {}).sort();
                for (const sec of sections) html += buildTable(combined[sec], sec);
                return html || '<div class="hint">No results available.</div>';
            }

            async function loadAndRender() {
                const combined = await api(PATH.export);
                results.innerHTML = buildHtmlFromCombined(combined);
            }

            document.getElementById('btnGen').onclick = async () => {
                try {
                    status.textContent = 'Running...';
                    const seed = parseInt(document.getElementById('g_seed').value, 10);
                    const raw = document.getElementById('g_pass').value.trim();
                    await api(PATH.generate, { method: 'POST', body: { seed, max_passes_override: raw ? parseInt(raw, 10) : null } });
                    status.textContent = 'Done';
                    await loadAndRender();
                } catch (e) {
                    status.textContent = 'Error';
                    alert('Generate failed: ' + e.message);
                }
            };

            (async () => { try { await loadAndRender(); } catch (_) { } })();
        }

        // ---------- Dispatcher ----------
        async function render() {
            try {
                switch (state.active) {
                    case 'semesters': await renderSemesters(); break;
                    case 'subjects': await renderSubjects(); break;
                    case 'teachers': await renderTeachers(); break;
                    case 'labs': await renderLabs(); break;
                    case 'prebooked': await renderPrebooked(); break;
                    case 'constants': await renderConstants(); break;
                    case 'generate': renderGenerate(); break;
                    default:
                        state.active = 'semesters';
                        await renderSemesters();
                }
            } catch (e) {
                panel.innerHTML = `<div style="padding:16px;color:#fca5a5">UI error: ${e.message}</div>`;
                console.error(e);
            }
        }

        // Initial render
        render();
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.active = (btn.dataset.view || '').trim();
                    render();
                };
            });
            state.active = 'semesters';
            render();
        });
    </script>




</body>
